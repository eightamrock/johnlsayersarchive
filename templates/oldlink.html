{% extends "base.html" %}
{% block content %}
<div class="read oldlink">
<h1>Find an old link</h1>
<p class="lede">Paste a johnlsayers.com forum link and this page will take you to the same thread, or the same post, in the archive.</p>
<form id="oldlink-form"><label class="vh" for="oldlink-url">Old johnlsayers.com link</label><input id="oldlink-url" type="url" placeholder="http://www.johnlsayers.com/phpBB2/viewtopic.php?t=4310" required> <button type="submit">Find thread</button></form>
<p id="oldlink-result" role="status"></p>
<noscript><p>This finder needs JavaScript. Without it, look for <strong>t=</strong> followed by a number in the old link: topic <strong>t=4310</strong> lives at <a href="/t/4310/">/t/4310/</a> here.</p></noscript>
</div>
<script>
(function () {
  var form = document.getElementById('oldlink-form');
  var out = document.getElementById('oldlink-result');
  var BASE = '{{ base_path }}';
  var mapPromise = null;
  function loadMap() {
    if (!mapPromise) {
      mapPromise = fetch(BASE + '/old-link/map.json').then(function (r) { return r.json(); }).then(function (m) {
        m.post = {};
        Object.keys(m.t).forEach(function (tid) {
          m.t[tid].forEach(function (pid, i) { m.post[pid] = [Number(tid), Math.floor(i / m.page_size) + 1]; });
        });
        return m;
      });
    }
    return mapPromise;
  }
  function param(qs, name) {
    var m = qs.match(new RegExp('[?&;]' + name + '=(\\d+)'));
    return m ? m[1] : null;
  }
  function say(msg) { out.textContent = msg; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var url = document.getElementById('oldlink-url').value.trim().replace(/&amp;/g, '&');
    if (!/johnlsayers\.com/i.test(url)) { say('That link is not from johnlsayers.com. Paste a link that contains johnlsayers.com.'); return; }
    say('Looking it up…');
    loadMap().then(function (map) {
      var p = param(url, 'p'), t = param(url, 't'), f = param(url, 'f');
      if (/viewtopic/i.test(url) && p && map.post[p]) {
        var loc = map.post[p];
        window.location.href = BASE + '/t/' + loc[0] + '/' + (loc[1] > 1 ? 'page/' + loc[1] + '/' : '') + '#p' + p;
        return;
      }
      if (/viewtopic/i.test(url) && t) {
        var tid = map.moved[t] || t;
        if (map.t[tid]) { window.location.href = BASE + '/t/' + tid + '/'; return; }
        say('Topic ' + t + ' was in a part of the forum that is not included in this archive.');
        return;
      }
      if (/viewforum/i.test(url) && f && map.forums[f]) { window.location.href = BASE + '/forum/' + map.forums[f] + '/'; return; }
      say('That link does not point to a thread or forum this archive can find. Check that it contains viewtopic.php or viewforum.php.');
    }).catch(function () { say('The link map could not be loaded. Reload the page and try again.'); });
  });
})();
</script>
{% endblock %}
